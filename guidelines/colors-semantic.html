<!-- @dsCard group="Colors" viewport="700x200" name="Semantic aliases" subtitle="Surfaces, text and borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.t{height:84px;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:12px;border:1px solid var(--stone-200)}.t b{font-weight:500}.t code{font-size:10px;opacity:.7}.tx{display:flex;gap:20px;margin-top:18px;font-size:15px;font-weight:500;flex-wrap:wrap}</style></head><body><div class="g"><div class="t" style="background:var(--bg-page);color:#000"><b>page</b><code>--bg-page</code></div><div class="t" style="background:var(--surface-card);color:#000"><b>card</b><code>--surface-card</code></div><div class="t" style="background:var(--surface-muted);color:#000"><b>muted</b><code>--surface-muted</code></div><div class="t" style="background:var(--surface-inverse);color:#fff"><b>inverse</b><code>--surface-inverse</code></div><div class="t" style="background:var(--surface-navy);color:#fff"><b>navy</b><code>--surface-navy</code></div><div class="t" style="background:var(--surface-accent);color:#fff"><b>accent</b><code>--surface-accent</code></div></div><div class="tx"><span style="color:var(--text-strong)">text-strong</span><span style="color:var(--text-body)">text-body</span><span style="color:var(--text-muted)">text-muted</span><span style="color:var(--text-subtle)">text-subtle</span><span style="color:var(--text-accent)">text-accent</span><span style="border-bottom:1px solid var(--border-default)">border-default</span></div></body></html>
