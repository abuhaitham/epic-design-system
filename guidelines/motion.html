<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="Slow ease-out reveals; hover = small shifts" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}@keyframes up{0%,20%{transform:translateY(14px);opacity:0}60%,100%{transform:none;opacity:1}}.mv{animation:up 2.4s var(--ease-out) infinite}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px"><div style="background:var(--stone-50);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px"><div class="mv" style="width:28px;height:28px;border-radius:50%;background:var(--accent)"></div><b style="font-weight:500;color:#000;font-size:15px">Reveal</b><span style="color:var(--text-muted);line-height:1.45">fade + 28px rise · 900ms · ease-out (.2,.7,.2,1) · 110ms stagger</span></div><div style="background:var(--stone-50);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px"><div class="mv" style="width:28px;height:28px;border-radius:50%;background:var(--accent)"></div><b style="font-weight:500;color:#000;font-size:15px">Hover</b><span style="color:var(--text-muted);line-height:1.45">arrow +4px · card −4px lift · image scale 1.04 over 1.2s</span></div><div style="background:var(--stone-50);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px"><div class="mv" style="width:28px;height:28px;border-radius:50%;background:var(--accent)"></div><b style="font-weight:500;color:#000;font-size:15px">Press</b><span style="color:var(--text-muted);line-height:1.45">scale(.97) · 150ms · no colour flash</span></div></div></body></html>
