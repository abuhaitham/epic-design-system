<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:4px;font-size:12px}.c{height:72px;border-radius:12px;margin-bottom:6px}.s b{font-weight:500;font-size:13px;color:#000}.s span{color:var(--text-muted)}.s code{font-size:11px;color:var(--stone-500);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--blue-50);border:1px solid var(--stone-200)"></div><b>50</b><span>#EEF2FF</span><code>--blue-50</code></div><div class="s"><div class="c" style="background:var(--blue-100)"></div><b>100</b><span>#DCE5FF</span><code>--blue-100</code></div><div class="s"><div class="c" style="background:var(--blue-200)"></div><b>200</b><span>#B5C8FF</span><code>--blue-200</code></div><div class="s"><div class="c" style="background:var(--blue-300)"></div><b>300</b><span>#86A5FF</span><code>--blue-300</code></div><div class="s"><div class="c" style="background:var(--blue-500)"></div><b>500</b><span>#366BFF</span><code>--blue-500</code></div><div class="s"><div class="c" style="background:var(--blue-600)"></div><b>600 hover</b><span>#2457E6</span><code>--blue-600</code></div><div class="s"><div class="c" style="background:var(--blue-700)"></div><b>700 press</b><span>#1B45BF</span><code>--blue-700</code></div><div class="s"><div class="c" style="background:var(--blue-900)"></div><b>900</b><span>#0B2266</span><code>--blue-900</code></div></div></body></html>
