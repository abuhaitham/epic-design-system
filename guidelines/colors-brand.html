<!-- @dsCard group="Colors" viewport="700x170" name="Official palette" subtitle="The five identity colours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:4px;font-size:12px}.c{height:72px;border-radius:12px;margin-bottom:6px}.s b{font-weight:500;font-size:13px;color:#000}.s span{color:var(--text-muted)}.s code{font-size:11px;color:var(--stone-500);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--epic-royal-blue)"></div><b>Royal Blue</b><span>#366BFF</span><code>--epic-royal-blue</code></div><div class="s"><div class="c" style="background:var(--epic-black)"></div><b>Black</b><span>#000000</span><code>--epic-black</code></div><div class="s"><div class="c" style="background:var(--epic-midnight-navy)"></div><b>Midnight Navy</b><span>#07142B</span><code>--epic-midnight-navy</code></div><div class="s"><div class="c" style="background:var(--epic-warm-gray)"></div><b>Warm Gray</b><span>#CFC8C3</span><code>--epic-warm-gray</code></div><div class="s"><div class="c" style="background:var(--epic-pale-stone);border:1px solid var(--stone-200)"></div><b>Pale Stone</b><span>#ECE8E5</span><code>--epic-pale-stone</code></div></div></body></html>
