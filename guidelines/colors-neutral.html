<!-- @dsCard group="Colors" viewport="700x170" name="Warm neutrals" subtitle="Stone scale derived from Pale Stone + Warm Gray" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:4px;font-size:12px}.c{height:72px;border-radius:12px;margin-bottom:6px}.s b{font-weight:500;font-size:13px;color:#000}.s span{color:var(--text-muted)}.s code{font-size:11px;color:var(--stone-500);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--stone-25);border:1px solid var(--stone-200)"></div><b>25</b><span>#FAF8F7</span><code>--stone-25</code></div><div class="s"><div class="c" style="background:var(--stone-50);border:1px solid var(--stone-200)"></div><b>50</b><span>#F5F2F0</span><code>--stone-50</code></div><div class="s"><div class="c" style="background:var(--stone-100)"></div><b>100</b><span>#ECE8E5</span><code>--stone-100</code></div><div class="s"><div class="c" style="background:var(--stone-200)"></div><b>200</b><span>#DFD9D4</span><code>--stone-200</code></div><div class="s"><div class="c" style="background:var(--stone-300)"></div><b>300</b><span>#CFC8C3</span><code>--stone-300</code></div><div class="s"><div class="c" style="background:var(--stone-500)"></div><b>500</b><span>#8F8883</span><code>--stone-500</code></div><div class="s"><div class="c" style="background:var(--stone-600)"></div><b>600</b><span>#6B6560</span><code>--stone-600</code></div><div class="s"><div class="c" style="background:var(--stone-700)"></div><b>700</b><span>#4A4541</span><code>--stone-700</code></div><div class="s"><div class="c" style="background:var(--stone-900)"></div><b>900</b><span>#1C1A18</span><code>--stone-900</code></div></div></body></html>
