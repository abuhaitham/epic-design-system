<!-- @dsCard group="Colors" viewport="700x150" name="Utility colours" subtitle="WhatsApp and status — use sparingly" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:4px;font-size:12px}.c{height:56px;border-radius:12px;margin-bottom:6px}.s b{font-weight:500;font-size:13px;color:#000}.s span{color:var(--text-muted)}.s code{font-size:11px;color:var(--stone-500);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--epic-whatsapp)"></div><b>WhatsApp</b><span>#25D366</span><code>--epic-whatsapp</code></div><div class="s"><div class="c" style="background:var(--success)"></div><b>Success</b><span>#1E7A4C</span><code>--success</code></div><div class="s"><div class="c" style="background:var(--warning)"></div><b>Warning</b><span>#9A5B00</span><code>--warning</code></div><div class="s"><div class="c" style="background:var(--danger)"></div><b>Danger</b><span>#C2362C</span><code>--danger</code></div><div class="s"><div class="c" style="background:var(--focus-ring)"></div><b>Focus ring</b><span>38% blue</span><code>--focus-ring</code></div></div></body></html>
